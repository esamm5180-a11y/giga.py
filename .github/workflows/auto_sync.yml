name: Auto Sync WE Lines

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run Auto Sync
        env:
          WE_USER: ${{ secrets.WE_USER }}
          WE_PASS: ${{ secrets.WE_PASS }}
        run: python sync.py
