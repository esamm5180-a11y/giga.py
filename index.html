<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>متابعة باقات الإنترنت المنزلي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    * {
      font-family: 'Cairo', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0b1120;
      color: #f8fafc;
    }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- شريط تنبيه التحديث البرمجي -->
  <div id="codeUpdateBanner" class="hidden fixed top-3 left-3 right-3 z-50 bg-sky-600 text-white px-4 py-2.5 rounded-xl shadow-2xl flex items-center justify-between text-xs font-bold border border-sky-400">
    <div class="flex items-center gap-2">
      <i class="fas fa-sparkles text-amber-300 text-base"></i>
      <span>يتوفر تحديث برمجي جديد للتطبيق!</span>
    </div>
    <button id="btnApplyUpdate" class="bg-white text-sky-700 px-3 py-1 rounded-lg font-extrabold hover:bg-slate-100 transition shadow">
      تحديث الآن
    </button>
  </div>

  <!-- الهيدر العلوي -->
  <header class="bg-slate-900/80 backdrop-blur-md sticky top-0 z-30 border-b border-slate-800 px-4 py-3 shadow-lg">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20">
          <i class="fas fa-wifi text-white text-lg"></i>
        </div>
        <div>
          <h1 class="text-base font-black text-white leading-tight">متابعة الجيجات</h1>
          <p class="text-[11px] text-slate-400 flex items-center gap-1.5">
            <span id="syncIndicator" class="w-2 h-2 rounded-full bg-amber-400 inline-block animate-pulse"></span>
            <span id="syncStatus">جاري فحص السيرفر...</span>
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="refreshDataFromServer()" title="تحديث يدوي من السيرفر" class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-700 transition">
          <i id="reloadIcon" class="fas fa-rotate"></i>
        </button>
        <button onclick="openModal('addModal')" class="bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white text-xs font-bold px-3.5 py-2 rounded-xl flex items-center gap-1.5 shadow-md shadow-sky-500/20 transition">
          <i class="fas fa-plus"></i>
          <span>إضافة خط</span>
        </button>
      </div>
    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class="max-w-4xl mx-auto p-4 space-y-4">

    <!-- شريط الإحصائيات السريعة -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-2xl">
        <div class="text-[11px] text-slate-400 font-bold mb-1">إجمالي الخطوط</div>
        <div id="statTotalLines" class="text-xl font-black text-white">0</div>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-2xl">
        <div class="text-[11px] text-slate-400 font-bold mb-1">إجمالي المتبقي</div>
        <div id="statTotalRemaining" class="text-xl font-black text-emerald-400">0 <span class="text-xs font-normal">GB</span></div>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-2xl">
        <div class="text-[11px] text-slate-400 font-bold mb-1">سحب اليوم المتوقع</div>
        <div id="statTotalBurn" class="text-xl font-black text-amber-400">0 <span class="text-xs font-normal">GB</span></div>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-2xl">
        <div class="text-[11px] text-slate-400 font-bold mb-1">نسخ احتياطي</div>
        <div class="flex items-center gap-2 mt-1">
          <button onclick="exportBackup()" class="text-xs bg-slate-800 hover:bg-slate-700 text-sky-400 px-2 py-1 rounded-lg border border-slate-700 transition" title="تحميل نسخة احتياطية"><i class="fas fa-download"></i></button>
          <label class="text-xs bg-slate-800 hover:bg-slate-700 text-amber-400 px-2 py-1 rounded-lg border border-slate-700 cursor-pointer transition" title="استرجاع نسخة"><i class="fas fa-upload"></i><input type="file" accept=".json" onchange="importBackup(event)" class="hidden"></label>
        </div>
      </div>
    </div>

    <!-- قائمة كروت الخطوط -->
    <div id="linesContainer" class="space-y-3">
      <div class="p-8 text-center text-slate-500 font-bold text-sm">
        <i class="fas fa-spinner fa-spin text-2xl mb-2 text-sky-500 block"></i>
        جاري تحميل بيانات الخطوط من Firebase...
      </div>
    </div>
  </main>

  <!-- نافذة إضافة / تعديل خط -->
  <div id="lineModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 id="modalTitle" class="text-base font-extrabold text-white">إضافة خط جديد</h3>
        <button onclick="closeModal('lineModal')" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center text-sm font-bold">✕</button>
      </div>

      <form id="lineForm" onsubmit="handleSaveLine(event)" class="space-y-3">
        <input type="hidden" id="editIndex" value="-1" />

        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">اسم الخط / الموقع</label>
          <input type="text" id="lineName" required placeholder="مثال: خط المحل، خط البيت..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">رقم الخدمة (أرضي WE)</label>
          <input type="tel" id="weServiceNumber" required placeholder="مثال: 0402085503" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white text-left font-mono focus:outline-none focus:border-sky-500" dir="ltr" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1">الباقة الكلية (GB)</label>
            <input type="number" id="totalQuota" required min="1" placeholder="مثال: 140 أو 250" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1">الرصيد المتبقي الحالي (GB)</label>
            <input type="number" step="0.01" id="baseBalance" required placeholder="مثال: 85.5" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1">معدل السحب اليومي (GB)</label>
            <input type="number" step="0.1" id="dailyManual" value="5.0" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1">يوم التجديد الشهري</label>
            <input type="number" id="renewalDay" min="1" max="31" value="1" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500" />
          </div>
        </div>

        <div class="pt-2 flex items-center justify-end gap-2">
          <button type="button" onclick="closeModal('lineModal')" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700">إلغاء</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-white text-xs font-extrabold shadow-lg shadow-sky-500/30">حفظ الخط</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://my-net-tracker-default-rtdb.firebaseio.com/net_tracker_data.json";
    let lines = [];
    let isSaving = false;

    // 1. الدالة الأساسية لتحميل البيانات دائماً من السيرفر أولاً
    async function fetchFromServer() {
      const syncStatus = document.getElementById("syncStatus");
      const syncIndicator = document.getElementById("syncIndicator");
      const reloadIcon = document.getElementById("reloadIcon");
      if (reloadIcon) reloadIcon.classList.add("fa-spin");

      try {
        syncStatus.textContent = "جاري المزامنة مع السيرفر...";
        syncIndicator.className = "w-2 h-2 rounded-full bg-amber-400 inline-block animate-pulse";

        const res = await fetch(FIREBASE_DB_URL + "?t=" + Date.now());
        const data = await res.json();

        let cleanLines = [];
        if (Array.isArray(data)) {
          cleanLines = data;
        } else if (data && typeof data === "object") {
          cleanLines = data.lines && Array.isArray(data.lines) ? data.lines : Object.values(data);
        }

        // تصفية العناصر غير الصالحة إن وجدت
        lines = cleanLines.filter(item => item && typeof item === "object" && item.name);

        // حفظ في الذاكرة المحلية كمرجع احتياطي فقط دون رفع
        localStorage.setItem("cached_lines", JSON.stringify(lines));

        syncStatus.textContent = "متصل ومتطابق مع السيرفر";
        syncIndicator.className = "w-2 h-2 rounded-full bg-emerald-500 inline-block";
      } catch (err) {
        console.error("خطأ في الاتصال بالسيرفر:", err);
        syncStatus.textContent = "وضع غير متصل (نسخة محلية)";
        syncIndicator.className = "w-2 h-2 rounded-full bg-rose-500 inline-block";

        const cached = localStorage.getItem("cached_lines");
        if (cached) {
          try { lines = JSON.parse(cached); } catch(e){}
        }
      } finally {
        if (reloadIcon) reloadIcon.classList.remove("fa-spin");
        renderLines();
      }
    }

    // 2. دالة حفظ البيانات إلى السيرفر (تستدعى فقط عند قيام المستخدم بإجراء فعلي)
    async function saveToServer() {
      if (isSaving) return;
      isSaving = true;
      const syncStatus = document.getElementById("syncStatus");
      const syncIndicator = document.getElementById("syncIndicator");

      try {
        syncStatus.textContent = "جاري الحفظ بالسيرفر...";
        syncIndicator.className = "w-2 h-2 rounded-full bg-amber-400 inline-block animate-pulse";

        const res = await fetch(FIREBASE_DB_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(lines)
        });

        if (!res.ok) throw new Error("رفض السيرفر الحفظ");

        localStorage.setItem("cached_lines", JSON.stringify(lines));
        syncStatus.textContent = "تم الحفظ بالسيرفر بنجاح";
        syncIndicator.className = "w-2 h-2 rounded-full bg-emerald-500 inline-block";
      } catch (err) {
        alert("تعذر حفظ التعديل في السيرفر! تأكد من اتصال الإنترنت وقواعد Firebase.");
        console.error(err);
      } finally {
        isSaving = false;
        renderLines();
      }
    }

    // رسم واجهة الخطوط
    function renderLines() {
      const container = document.getElementById("linesContainer");
      if (!lines || lines.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center bg-slate-900/40 border border-slate-800 rounded-2xl text-slate-400 space-y-3">
            <i class="fas fa-folder-open text-3xl text-slate-600 block"></i>
            <p class="text-sm font-bold">لا توجد أي خطوط مسجلة حالياً بالسيرفر</p>
            <button onclick="openAddModal()" class="text-xs bg-sky-500 text-white font-extrabold px-4 py-2 rounded-xl shadow-lg shadow-sky-500/20">إضافة خطك الأول</button>
          </div>
        `;
        updateStats();
        return;
      }

      let totalRem = 0;
      let totalBurn = 0;

      container.innerHTML = lines.map((line, index) => {
        const total = parseFloat(line.totalQuota) || 140;
        const current = parseFloat(line.baseBalance) || 0;
        const daily = parseFloat(line.dailyManual) || 5.0;
        const daysLeft = daily > 0 ? Math.floor(current / daily) : "∞";
        const percent = Math.min(100, Math.max(0, Math.round((current / total) * 100)));

        totalRem += current;
        totalBurn += daily;

        return `
          <div class="bg-slate-900/80 border border-slate-800/80 hover:border-slate-700/80 rounded-2xl p-4 shadow-xl transition space-y-3">
            <div class="flex items-start justify-between">
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="font-extrabold text-base text-white">${line.name}</h3>
                  <span class="text-[10px] font-bold bg-slate-800 text-sky-400 px-2 py-0.5 rounded-md font-mono" dir="ltr">${line.weServiceNumber || 'بدون رقم'}</span>
                </div>
                <p class="text-[11px] text-slate-400 mt-0.5">تجديد يوم ${line.renewalDay || 1} من كل شهر</p>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="editLine(${index})" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 flex items-center justify-center text-xs transition" title="تعديل الخط"><i class="fas fa-pen"></i></button>
                <button onclick="deleteLine(${index})" class="w-8 h-8 rounded-lg bg-slate-800 text-rose-400 hover:text-rose-300 hover:bg-rose-950/40 flex items-center justify-center text-xs transition" title="حذف الخط"><i class="fas fa-trash-can"></i></button>
              </div>
            </div>

            <!-- أرقام الرصيد والجيجات -->
            <div class="grid grid-cols-3 gap-2 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/50 text-center">
              <div>
                <div class="text-[10px] text-slate-400 font-bold">المتبقي الحقيقي</div>
                <div class="text-sm font-black text-emerald-400 font-mono mt-0.5">${current} <span class="text-[10px] font-normal">GB</span></div>
              </div>
              <div>
                <div class="text-[10px] text-slate-400 font-bold">السحب اليومي</div>
                <div class="text-sm font-black text-amber-400 font-mono mt-0.5">${daily} <span class="text-[10px] font-normal">GB</span></div>
              </div>
              <div>
                <div class="text-[10px] text-slate-400 font-bold">الأيام المتبقية</div>
                <div class="text-sm font-black text-sky-400 font-mono mt-0.5">${daysLeft} <span class="text-[10px] font-normal">يوم</span></div>
              </div>
            </div>

            <!-- شريط النسبة المئوية -->
            <div>
              <div class="flex justify-between text-[11px] font-bold text-slate-400 mb-1">
                <span>نسبة المتبقي</span>
                <span>${percent}% (من أصل ${total} GB)</span>
              </div>
              <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden p-0.5">
                <div class="h-full rounded-full ${percent < 20 ? 'bg-rose-500' : percent < 40 ? 'bg-amber-400' : 'bg-gradient-to-r from-sky-500 to-emerald-400'} transition-all duration-500" style="width: ${percent}%"></div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      updateStats(lines.length, totalRem, totalBurn);
    }

    function updateStats(count = 0, rem = 0, burn = 0) {
      document.getElementById("statTotalLines").textContent = count;
      document.getElementById("statTotalRemaining").innerHTML = `${Math.round(rem * 10) / 10} <span class="text-xs font-normal">GB</span>`;
      document.getElementById("statTotalBurn").innerHTML = `${Math.round(burn * 10) / 10} <span class="text-xs font-normal">GB</span>`;
    }

    // حفظ الخط
    function handleSaveLine(e) {
      e.preventDefault();
      const index = parseInt(document.getElementById("editIndex").value);

      const newLineData = {
        name: document.getElementById("lineName").value.trim(),
        weServiceNumber: document.getElementById("weServiceNumber").value.trim(),
        totalQuota: parseFloat(document.getElementById("totalQuota").value) || 140,
        baseBalance: parseFloat(document.getElementById("baseBalance").value) || 0,
        dailyManual: parseFloat(document.getElementById("dailyManual").value) || 5.0,
        renewalDay: parseInt(document.getElementById("renewalDay").value) || 1,
        lastSyncTime: Date.now()
      };

      if (index === -1) {
        lines.push(newLineData);
      } else {
        lines[index] = { ...lines[index], ...newLineData };
      }

      closeModal('lineModal');
      saveToServer();
    }

    function openAddModal() {
      document.getElementById("editIndex").value = "-1";
      document.getElementById("modalTitle").textContent = "إضافة خط إنترنت جديد";
      document.getElementById("lineForm").reset();
      openModal('lineModal');
    }

    function editLine(index) {
      const line = lines[index];
      if (!line) return;
      document.getElementById("editIndex").value = index;
      document.getElementById("modalTitle").textContent = "تعديل بيانات: " + line.name;
      document.getElementById("lineName").value = line.name || "";
      document.getElementById("weServiceNumber").value = line.weServiceNumber || "";
      document.getElementById("totalQuota").value = line.totalQuota || 140;
      document.getElementById("baseBalance").value = line.baseBalance || 0;
      document.getElementById("dailyManual").value = line.dailyManual || 5.0;
      document.getElementById("renewalDay").value = line.renewalDay || 1;
      openModal('lineModal');
    }

    function deleteLine(index) {
      if (!confirm(`هل أنت متأكد من حذف الخط (${lines[index].name}) من السيرفر نهائياً؟`)) return;
      lines.splice(index, 1);
      saveToServer();
    }

    function refreshDataFromServer() {
      fetchFromServer();
    }

    function openModal(id) {
      document.getElementById(id).classList.remove("hidden");
    }

    function closeModal(id) {
      document.getElementById(id).classList.add("hidden");
    }

    // النسخ الاحتياطي
    function exportBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(lines, null, 2));
      const a = document.createElement("a");
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `backup_lines_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importBackup(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            lines = imported;
            saveToServer();
            alert("تم استرجاع النسخة الاحتياطية ورفعها للسيرفر بنجاح!");
          } else {
            alert("ملف غير صالح!");
          }
        } catch(err) {
          alert("خطأ أثناء قراءة الملف!");
        }
      };
      reader.readAsText(file);
    }

    // 3. نظام التحديث البرمجي عبر مستودع GitHub
    let lastKnownCommit = "";
    function checkCodeUpdates() {
      fetch("https://api.github.com/repos/esamm5180-a11y/giga.py/commits/main", {
        headers: { "Accept": "application/vnd.github.v3+json" }
      })
      .then(res => res.json())
      .then(data => {
        if (!data || !data.sha) return;
        const currentCommit = data.sha;
        if (!lastKnownCommit) {
          lastKnownCommit = localStorage.getItem("app_commit_version") || currentCommit;
          localStorage.setItem("app_commit_version", lastKnownCommit);
        }
        if (currentCommit !== lastKnownCommit) {
          const banner = document.getElementById("codeUpdateBanner");
          if (banner) banner.classList.remove("hidden");
          const btn = document.getElementById("btnApplyUpdate");
          if (btn) {
            btn.onclick = function() {
              localStorage.setItem("app_commit_version", currentCommit);
              window.location.reload(true);
            };
          }
        }
      })
      .catch(() => {});
    }

    // بدء التشغيل
    window.addEventListener("DOMContentLoaded", () => {
      fetchFromServer();
      checkCodeUpdates();
      // فحص أوتوماتيكي دوري للسيرفر كل دقيقتين لضمان مزامنة الهاتفين
      setInterval(fetchFromServer, 120000);
      setInterval(checkCodeUpdates, 60000);
    });
  </script>
</body>
</html>
