<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Balaha.Net | إدارة ومتابعة الخطوط</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    * { font-family: 'Cairo', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0b1120; color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- شريط التحديث البرمجي للكود -->
  <div id="codeUpdateBanner" class="hidden fixed top-3 left-3 right-3 z-50 bg-sky-600 text-white px-4 py-2.5 rounded-xl shadow-2xl flex items-center justify-between text-xs font-bold border border-sky-400">
    <div class="flex items-center gap-2">
      <i class="fas fa-sparkles text-amber-300 text-base"></i>
      <span>يتوفر تحديث برمجي جديد للتطبيق!</span>
    </div>
    <button id="btnApplyUpdate" class="bg-white text-sky-700 px-3 py-1 rounded-lg font-extrabold hover:bg-slate-100 transition shadow">تحديث الآن</button>
  </div>

  <!-- الهيدر -->
  <header class="bg-slate-900/90 backdrop-blur-md sticky top-0 z-30 border-b border-slate-800 px-4 py-3 shadow-lg">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center shadow-lg shadow-sky-500/20">
          <i class="fas fa-wifi text-white text-sm"></i>
        </div>
        <div>
          <h1 class="text-sm font-black text-white">متابعة الجيجات</h1>
          <p class="text-[10px] text-slate-400 flex items-center gap-1.5">
            <span id="syncDot" class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
            <span id="syncText">متصل بالسيرفر</span>
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="manualSync()" title="تحديث البيانات فوراً" class="w-8 h-8 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition">
          <i id="syncIcon" class="fas fa-rotate text-xs"></i>
        </button>
        <button onclick="openAddModal()" class="bg-sky-500 hover:bg-sky-400 text-white text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1.5 shadow-md shadow-sky-500/20 transition">
          <i class="fas fa-plus"></i>
          <span>إضافة خط</span>
        </button>
      </div>
    </div>
  </header>

  <!-- الصفحة الرئيسية -->
  <main class="max-w-2xl mx-auto p-3.5 space-y-3.5">

    <!-- كروت ملخص عامة -->
    <div class="grid grid-cols-3 gap-2 bg-slate-900/70 border border-slate-800/80 p-2.5 rounded-2xl text-center">
      <div>
        <div class="text-[10px] text-slate-400 font-bold">إجمالي الخطوط</div>
        <div id="statLinesCount" class="text-base font-black text-white mt-0.5">0</div>
      </div>
      <div>
        <div class="text-[10px] text-slate-400 font-bold">المتبقي الكلي</div>
        <div id="statTotalGB" class="text-base font-black text-emerald-400 font-mono mt-0.5">0 <span class="text-[9px] font-normal">GB</span></div>
      </div>
      <div>
        <div class="text-[10px] text-slate-400 font-bold">النسخ الاحتياطي</div>
        <div class="flex justify-center items-center gap-2 mt-1">
          <button onclick="exportJSON()" title="تصدير ملف احتياطي" class="text-xs bg-slate-800 text-sky-400 px-2 py-0.5 rounded border border-slate-700 hover:bg-slate-700"><i class="fas fa-download"></i></button>
          <label title="استيراد ملف احتياطي" class="text-xs bg-slate-800 text-amber-400 px-2 py-0.5 rounded border border-slate-700 hover:bg-slate-700 cursor-pointer"><i class="fas fa-upload"></i><input type="file" accept=".json" onchange="importJSON(event)" class="hidden"></label>
        </div>
      </div>
    </div>

    <!-- قائمة كروت الخطوط -->
    <div id="linesList" class="space-y-3">
      <div class="p-8 text-center text-slate-400 font-bold text-xs">
        <i class="fas fa-circle-notch fa-spin text-xl text-sky-500 mb-2 block"></i>
        جاري مزامنة الخطوط من Firebase...
      </div>
    </div>
  </main>

  <!-- نافذة إضافة / تعديل خط -->
  <div id="modalBox" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-4 space-y-3 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
        <h3 id="modalTitle" class="text-xs font-black text-white">إضافة خط جديد</h3>
        <button onclick="closeModal()" class="w-6 h-6 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center text-xs font-bold">✕</button>
      </div>

      <form id="lineForm" onsubmit="saveLineData(event)" class="space-y-2.5">
        <input type="hidden" id="editIndex" value="-1" />

        <div>
          <label class="block text-[11px] font-bold text-slate-400 mb-1">اسم الخط</label>
          <input type="text" id="lineName" required placeholder="مثال: خط المحل" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-sky-500" />
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-400 mb-1">رقم الخدمة (التليفون الأرضي لـ WE)</label>
          <input type="tel" id="weServiceNumber" required placeholder="مثال: 0402085503" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white font-mono text-left focus:outline-none focus:border-sky-500" dir="ltr" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-slate-400 mb-1">الباقة الكلية (GB)</label>
            <input type="number" id="totalQuota" required min="1" placeholder="140" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-sky-500" />
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-400 mb-1">الرصيد المتبقي (GB)</label>
            <input type="number" step="0.01" id="baseBalance" required placeholder="85.5" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-sky-500" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-slate-400 mb-1">السحب اليومي (GB)</label>
            <input type="number" step="0.1" id="dailyManual" value="5.0" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-sky-500" />
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-400 mb-1">يوم التجديد</label>
            <input type="number" id="renewalDay" min="1" max="31" value="1" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-sky-500" />
          </div>
        </div>

        <div class="pt-2 flex items-center justify-end gap-2 border-t border-slate-800">
          <button type="button" onclick="closeModal()" class="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700">إلغاء</button>
          <button type="submit" class="px-4 py-1.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-white text-xs font-black shadow-md shadow-sky-500/20">حفظ الخط</button>
        </div>
      </form>
    </div>
  </div>

  <!-- نافذة إضافة كوتة إضافية سريعة -->
  <div id="quotaModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xs p-4 space-y-3 shadow-2xl">
      <h3 class="text-xs font-black text-white border-b border-slate-800 pb-2" id="quotaLineTitle">إضافة كوتة</h3>
      <div>
        <label class="block text-[11px] font-bold text-slate-400 mb-1">الجيجات الإضافية (GB)</label>
        <input type="number" id="addQuotaInput" min="1" value="20" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white text-center font-bold focus:outline-none focus:border-emerald-500" />
      </div>
      <div class="flex items-center justify-end gap-2 pt-1">
        <button type="button" onclick="closeQuotaModal()" class="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">إلغاء</button>
        <button type="button" onclick="applyAddQuota()" class="px-4 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black shadow">إضافة للرصيد</button>
      </div>
    </div>
  </div>

  <script>
    const DB_URL = "https://my-net-tracker-default-rtdb.firebaseio.com/net_tracker_data.json";
    let globalLines = [];
    let activeQuotaIndex = -1;

    // 1. الدالة الأساسية: القراءة الحية من السيرفر دائماً
    async function loadDataLive(isManual = false) {
      const syncDot = document.getElementById("syncDot");
      const syncText = document.getElementById("syncText");
      const syncIcon = document.getElementById("syncIcon");

      if (isManual && syncIcon) syncIcon.classList.add("fa-spin");

      try {
        const response = await fetch(DB_URL + "?cache=" + Date.now());
        const data = await response.json();

        let cleanList = [];
        if (Array.isArray(data)) {
          cleanList = data;
        } else if (data && typeof data === 'object') {
          cleanList = data.lines && Array.isArray(data.lines) ? data.lines : Object.values(data);
        }

        // تصفية العناصر الصحيحة فقط
        globalLines = cleanList.filter(l => l && typeof l === 'object' && l.name);

        syncDot.className = "w-2 h-2 rounded-full bg-emerald-500 inline-block";
        syncText.textContent = "متصل بالسيرفر (بيانات حية)";
      } catch (err) {
        console.warn("تعذر الوصول للسيرفر:", err);
        syncDot.className = "w-2 h-2 rounded-full bg-rose-500 inline-block";
        syncText.textContent = "غير متصل";
      } finally {
        if (isManual && syncIcon) syncIcon.classList.remove("fa-spin");
        renderLinesUI();
      }
    }

    // 2. الحفظ إلى السيرفر: يتم استدعاؤه فقط عند أمر يدوي صريح من المستخدم
    async function pushToServer() {
      const syncDot = document.getElementById("syncDot");
      const syncText = document.getElementById("syncText");

      syncDot.className = "w-2 h-2 rounded-full bg-amber-400 inline-block animate-pulse";
      syncText.textContent = "جاري الحفظ في السيرفر...";

      try {
        const res = await fetch(DB_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(globalLines)
        });

        if (!res.ok) throw new Error("رفض السيرفر الحفظ");

        syncDot.className = "w-2 h-2 rounded-full bg-emerald-500 inline-block";
        syncText.textContent = "تم الحفظ بالسيرفر بنجاح";
      } catch (err) {
        alert("فشل الحفظ في Firebase! يرجى التأكد من اتصال الإنترنت.");
        console.error(err);
      } finally {
        renderLinesUI();
      }
    }

    // عرض الخطوط على الواجهة
    function renderLinesUI() {
      const list = document.getElementById("linesList");
      if (!globalLines || globalLines.length === 0) {
        list.innerHTML = `
          <div class="p-8 text-center bg-slate-900/40 border border-slate-800 rounded-2xl text-slate-400 space-y-2">
            <i class="fas fa-network-wired text-3xl text-slate-600 block"></i>
            <p class="text-xs font-bold">لا توجد خطوط مسجلة حتى الآن</p>
            <button onclick="openAddModal()" class="text-xs bg-sky-500 text-white font-bold px-3 py-1.5 rounded-xl shadow mt-2">إضافة أول خط</button>
          </div>
        `;
        document.getElementById("statLinesCount").textContent = "0";
        document.getElementById("statTotalGB").innerHTML = `0 <span class="text-[9px] font-normal">GB</span>`;
        return;
      }

      let totalRem = 0;

      list.innerHTML = globalLines.map((line, idx) => {
        const total = parseFloat(line.totalQuota) || 140;
        const current = parseFloat(line.baseBalance) || 0;
        const daily = parseFloat(line.dailyManual) || 5.0;
        const daysLeft = daily > 0 ? Math.floor(current / daily) : "∞";
        const percent = Math.min(100, Math.max(0, Math.round((current / total) * 100)));

        totalRem += current;

        return `
          <div class="bg-slate-900/80 border border-slate-800 hover:border-slate-700 rounded-2xl p-3 shadow-lg space-y-2.5">
            <div class="flex items-start justify-between">
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="font-extrabold text-sm text-white">${line.name}</h3>
                  <span class="text-[10px] font-bold bg-slate-800 text-sky-400 px-2 py-0.5 rounded-md font-mono" dir="ltr">${line.weServiceNumber || 'بدون رقم'}</span>
                </div>
                <p class="text-[10px] text-slate-400 mt-0.5">تجديد يوم ${line.renewalDay || 1} من الشهر</p>
              </div>

              <!-- أزرار الإجراءات -->
              <div class="flex items-center gap-1">
                <button onclick="openAddQuotaModal(${idx})" class="h-7 px-2 rounded-lg bg-emerald-950/40 border border-emerald-800/50 text-emerald-400 text-[10px] font-bold hover:bg-emerald-900/60 transition" title="شحن كوتة إضافية">+ كوتة</button>
                <button onclick="renewMonthlyPackage(${idx})" class="h-7 px-2 rounded-lg bg-amber-950/40 border border-amber-800/50 text-amber-400 text-[10px] font-bold hover:bg-amber-900/60 transition" title="تجديد باقة الشهر">تجديد</button>
                <button onclick="openEditModal(${idx})" class="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center text-xs transition"><i class="fas fa-pen"></i></button>
                <button onclick="deleteLineItem(${idx})" class="w-7 h-7 rounded-lg bg-slate-800 text-rose-400 hover:text-rose-300 flex items-center justify-center text-xs transition"><i class="fas fa-trash-can"></i></button>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-2 bg-slate-950/60 p-2 rounded-xl border border-slate-800/60 text-center">
              <div>
                <div class="text-[9px] text-slate-400 font-bold">المتبقي الحقيقي</div>
                <div class="text-xs font-black text-emerald-400 font-mono mt-0.5">${current} <span class="text-[8px] font-normal">GB</span></div>
              </div>
              <div>
                <div class="text-[9px] text-slate-400 font-bold">السحب اليومي</div>
                <div class="text-xs font-black text-amber-400 font-mono mt-0.5">${daily} <span class="text-[8px] font-normal">GB</span></div>
              </div>
              <div>
                <div class="text-[9px] text-slate-400 font-bold">الأيام المتبقية</div>
                <div class="text-xs font-black text-sky-400 font-mono mt-0.5">${daysLeft} <span class="text-[8px] font-normal">يوم</span></div>
              </div>
            </div>

            <div>
              <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-1">
                <span>نسبة المتبقي</span>
                <span>${percent}% (${current}/${total} GB)</span>
              </div>
              <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden p-0.5">
                <div class="h-full rounded-full ${percent < 20 ? 'bg-rose-500' : percent < 40 ? 'bg-amber-400' : 'bg-gradient-to-r from-sky-500 to-emerald-400'} transition-all" style="width: ${percent}%"></div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById("statLinesCount").textContent = globalLines.length;
      document.getElementById("statTotalGB").innerHTML = `${Math.round(totalRem * 10) / 10} <span class="text-[9px] font-normal">GB</span>`;
    }

    // حفظ الخط بعد التعديل أو الإضافة
    function saveLineData(e) {
      e.preventDefault();
      const idx = parseInt(document.getElementById("editIndex").value);

      const item = {
        name: document.getElementById("lineName").value.trim(),
        weServiceNumber: document.getElementById("weServiceNumber").value.trim(),
        totalQuota: parseFloat(document.getElementById("totalQuota").value) || 140,
        baseBalance: parseFloat(document.getElementById("baseBalance").value) || 0,
        dailyManual: parseFloat(document.getElementById("dailyManual").value) || 5.0,
        renewalDay: parseInt(document.getElementById("renewalDay").value) || 1,
        lastSyncTime: Date.now()
      };

      if (idx === -1) {
        globalLines.push(item);
      } else {
        globalLines[idx] = { ...globalLines[idx], ...item };
      }

      closeModal();
      pushToServer();
    }

    // تجديد باقة الشهر وإعادة الرصيد للأصل
    function renewMonthlyPackage(idx) {
      const line = globalLines[idx];
      if (!confirm(`هل أنت متأكد من تجديد باقة (${line.name}) وإعادة رصيدها إلى ${line.totalQuota} GB؟`)) return;
      line.baseBalance = parseFloat(line.totalQuota);
      line.lastSyncTime = Date.now();
      pushToServer();
    }

    // فتح نافذة الكوتة
    function openAddQuotaModal(idx) {
      activeQuotaIndex = idx;
      document.getElementById("quotaLineTitle").textContent = "إضافة كوتة لـ: " + globalLines[idx].name;
      document.getElementById("quotaModal").classList.remove("hidden");
    }

    function closeQuotaModal() {
      document.getElementById("quotaModal").classList.add("hidden");
      activeQuotaIndex = -1;
    }

    // تطبيق إضافة الكوتة وحفظها بالسيرفر
    function applyAddQuota() {
      if (activeQuotaIndex === -1) return;
      const extraGB = parseFloat(document.getElementById("addQuotaInput").value) || 0;
      if (extraGB <= 0) return;

      globalLines[activeQuotaIndex].baseBalance = Math.round(((parseFloat(globalLines[activeQuotaIndex].baseBalance) || 0) + extraGB) * 100) / 100;
      globalLines[activeQuotaIndex].lastSyncTime = Date.now();

      closeQuotaModal();
      pushToServer();
    }

    function openAddModal() {
      document.getElementById("editIndex").value = "-1";
      document.getElementById("modalTitle").textContent = "إضافة خط إنترنت جديد";
      document.getElementById("lineForm").reset();
      document.getElementById("modalBox").classList.remove("hidden");
    }

    function openEditModal(idx) {
      const line = globalLines[idx];
      document.getElementById("editIndex").value = idx;
      document.getElementById("modalTitle").textContent = "تعديل: " + line.name;
      document.getElementById("lineName").value = line.name || "";
      document.getElementById("weServiceNumber").value = line.weServiceNumber || "";
      document.getElementById("totalQuota").value = line.totalQuota || 140;
      document.getElementById("baseBalance").value = line.baseBalance || 0;
      document.getElementById("dailyManual").value = line.dailyManual || 5.0;
      document.getElementById("renewalDay").value = line.renewalDay || 1;
      document.getElementById("modalBox").classList.remove("hidden");
    }

    function deleteLineItem(idx) {
      if (!confirm(`هل تريد حذف الخط (${globalLines[idx].name}) من السيرفر نهائياً؟`)) return;
      globalLines.splice(idx, 1);
      pushToServer();
    }

    function closeModal() { document.getElementById("modalBox").classList.add("hidden"); }
    function manualSync() { loadDataLive(true); }

    // النسخ الاحتياطي
    function exportJSON() {
      const blob = new Blob([JSON.stringify(globalLines, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `backup_lines_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (Array.isArray(parsed)) {
            globalLines = parsed;
            pushToServer();
            alert("تم استرجاع الخطوط ورفعها للسيرفر بنجاح!");
          }
        } catch(e) { alert("ملف غير صالح!"); }
      };
      r.readAsText(file);
    }

    // فحص تحديث الكود البرمجي من GitHub
    let lastCommit = "";
    function checkRepoUpdates() {
      fetch("https://api.github.com/repos/esamm5180-a11y/giga.py/commits/main", {
        headers: { "Accept": "application/vnd.github.v3+json" }
      })
      .then(res => res.json())
      .then(data => {
        if (!data || !data.sha) return;
        const current = data.sha;
        if (!lastCommit) {
          lastCommit = localStorage.getItem("app_commit_version") || current;
          localStorage.setItem("app_commit_version", lastCommit);
        }
        if (current !== lastCommit) {
          document.getElementById("codeUpdateBanner").classList.remove("hidden");
          document.getElementById("btnApplyUpdate").onclick = function() {
            localStorage.setItem("app_commit_version", current);
            window.location.reload(true);
          };
        }
      }).catch(() => {});
    }

    // بدء العمل
    window.addEventListener("DOMContentLoaded", () => {
      loadDataLive(true);
      checkRepoUpdates();
      // مزامنة حية كل 15 ثانية لجلب أي تعديل من التليفون الآخر فوراً
      setInterval(() => loadDataLive(false), 15000);
      setInterval(checkRepoUpdates, 60000);
    });
  </script>
</body>
</html>
