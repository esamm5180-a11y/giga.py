<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إدارة ومتابعة خطوط الإنترنت</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: #050811;
            --surface-card: rgba(13, 20, 36, 0.85);
            --surface-elevated: rgba(22, 33, 58, 0.65);
            --surface-inner: rgba(6, 11, 22, 0.7);
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
            --accent-glow: rgba(56, 189, 248, 0.3);
            --accent-cyan: #22d3ee;
            --danger: #f43f5e;
            --danger-bg: rgba(244, 63, 94, 0.15);
            --danger-glow: rgba(244, 63, 94, 0.35);
            --warning: #f59e0b;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.15);
            --success-glow: rgba(16, 185, 129, 0.35);
            --telegram: #0284c7;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(56, 189, 248, 0.4);
            --radius-xl: 22px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --shadow-xl: 0 20px 45px -10px rgba(0, 0, 0, 0.75);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace !important;
        }

        body {
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 0% 0%, rgba(14, 165, 233, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 20%, rgba(15, 23, 42, 0.8) 0px, transparent 100%);
            color: var(--text-primary);
            padding: 16px;
            min-height: 100vh;
        }

        .app-container {
            max-width: 880px;
            margin: 0 auto;
        }

        header {
            background: var(--surface-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 16px 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-xl);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), #818cf8, transparent);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: var(--accent-gradient);
            box-shadow: 0 6px 18px var(--accent-glow);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .brand-meta {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .brand-meta h1 {
            font-size: 19px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .brand-note-pill {
            font-size: 11.5px;
            color: var(--accent);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .brand-lines-counter {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 700;
            margin-top: 1px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .brand-lines-counter span {
            color: var(--accent);
        }

        .header-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .btn-search-trigger {
            background: var(--surface-inner);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 9px 12px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            flex: 1.3;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .btn-search-trigger:hover {
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.05);
        }

        .btn {
            border: none;
            outline: none;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-flex {
            flex: 1;
        }

        .btn-settings {
            background: var(--surface-inner);
            color: var(--text-primary);
            border: 1px solid var(--border);
            flex: 0.9;
        }

        .btn-settings:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--border-hover);
        }

        .btn-pay {
            background: var(--surface-inner);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-pay:hover {
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-pay.paid {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
            color: #ffffff !important;
            border-color: #10b981 !important;
            box-shadow: 0 4px 14px var(--success-glow) !important;
        }

        .btn-extra {
            background: rgba(14, 165, 233, 0.12);
            color: #38bdf8;
            border: 1px solid rgba(14, 165, 233, 0.35);
        }

        .btn-extra:hover {
            background: rgba(14, 165, 233, 0.22);
            border-color: #38bdf8;
        }

        .btn-history {
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.35);
        }

        .btn-history:hover {
            background: rgba(245, 158, 11, 0.22);
        }

        .btn-accent {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 14px var(--accent-glow);
            border: 1px solid rgba(255, 255, 255, 0.15);
            flex: 1.4;
        }

        .btn-accent:hover {
            filter: brightness(1.08);
        }

        .btn-action-icon {
            background: var(--surface-inner);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 0 12px;
            font-size: 12.5px;
            flex: 0.8;
        }

        .btn-action-icon:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--border-hover);
        }

        .btn-action-icon.danger:hover {
            color: var(--danger);
            border-color: rgba(244, 63, 94, 0.4);
            background: var(--danger-bg);
        }

        /* أزرار سريعة داخل صف الجدول */
        .btn-row-extra {
            background: rgba(14, 165, 233, 0.12);
            color: #38bdf8;
            border: 1px solid rgba(14, 165, 233, 0.3);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-row-extra:hover {
            background: var(--accent);
            color: #040814;
            border-color: transparent;
        }

        .btn-row-pay {
            background: var(--surface-inner);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-row-pay.paid {
            background: var(--success-bg);
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.4);
        }

        .btn-row-pay.unpaid {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
        }

        .btn-row-pay:hover {
            border-color: #38bdf8;
        }

        .alert-hub {
            display: none;
            background: var(--danger-bg);
            border: 1px solid rgba(244, 63, 94, 0.35);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: 16px;
        }

        .alert-hub.active {
            display: block;
        }

        .alert-hub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .alert-hub-header h4 {
            color: #fda4af;
            font-size: 12.5px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .alert-lines-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .alert-line-item {
            background: rgba(5, 8, 17, 0.7);
            border: 1px solid rgba(244, 63, 94, 0.25);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .alert-line-item:hover {
            background: rgba(5, 8, 17, 0.95);
            border-color: var(--danger);
        }

        .alert-tag {
            font-size: 10.5px;
            padding: 2px 6px;
            border-radius: 5px;
            font-weight: 800;
        }

        .alert-tag.gb {
            background: rgba(244, 63, 94, 0.25);
            color: #fecdd3;
        }

        .alert-tag.days {
            background: rgba(245, 158, 11, 0.25);
            color: #fde68a;
        }

        .hero-card {
            background: var(--surface-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 20px 22px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-xl);
            position: relative;
        }

        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .live-chip {
            background: var(--success-bg);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse-dot 1.2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
        }

        .hero-balance {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin: 4px 0 10px 0;
        }

        .hero-balance .number {
            font-size: 36px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .hero-balance .unit {
            font-size: 15px;
            color: var(--accent);
            font-weight: 800;
        }

        .progress-container {
            margin: 14px 0 12px 0;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 11.5px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            height: 8px;
            background: var(--surface-inner);
            border-radius: 100px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0ea5e9 0%, #6366f1 100%);
            border-radius: 100px;
            transition: width 0.3s ease;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .hero-details-container {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .details-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .stepper-wrap {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .stepper-btn {
            background: var(--surface-inner);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.15s;
        }

        .stepper-btn:hover {
            background: var(--accent-gradient);
            color: #fff;
            border-color: transparent;
        }

        .clickable-burn {
            cursor: pointer;
            border-bottom: 1px dashed rgba(56, 189, 248, 0.5);
            color: #e2e8f0;
            transition: color 0.2s;
        }

        .clickable-burn:hover {
            color: var(--accent);
        }

        .all-lines-card {
            background: var(--surface-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 18px 20px;
            box-shadow: var(--shadow-xl);
            margin-bottom: 16px;
        }

        .all-lines-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            padding-bottom: 8px;
        }

        .all-lines-header h3 {
            font-size: 15px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #f8fafc;
        }

        .sort-toggle-badge {
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .sort-toggle-badge:hover {
            background: rgba(56, 189, 248, 0.22);
        }

        .sort-selector-bar {
            display: none;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            background: var(--surface-inner);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 6px;
            margin-bottom: 12px;
        }

        .sort-selector-bar.active {
            display: grid;
        }

        .sort-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 800;
            padding: 7px 4px;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            white-space: nowrap;
        }

        .sort-tab-btn.active {
            background: var(--accent-gradient);
            color: #ffffff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .lines-table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        .lines-table th {
            padding: 10px 12px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 700;
            border-bottom: 1px solid var(--border);
        }

        .lines-table td {
            padding: 11px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 12.5px;
        }

        .lines-table tr {
            transition: background 0.15s;
        }

        .lines-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
        }

        .status-pill {
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .status-pill.safe {
            background: var(--success-bg);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-pill.danger {
            background: var(--danger-bg);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .status-pill.paid-pending {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .app-modal {
            background: #090f1d;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            width: 100%;
            max-width: 440px;
            max-height: 92vh;
            overflow-y: auto;
            padding: 22px 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
        }

        .modal-avatar-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 14px;
            position: relative;
        }

        .modal-avatar {
            width: 50px;
            height: 50px;
            background: var(--surface-inner);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 22px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .modal-close-btn {
            position: absolute;
            top: -4px;
            left: 0;
            background: var(--surface-inner);
            border: 1px solid var(--border);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-close-btn:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .form-row {
            margin-bottom: 12px;
        }

        .form-row label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 5px;
        }

        .form-input {
            width: 100%;
            background: var(--surface-inner);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            color: #fff;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--accent);
            background: rgba(6, 11, 22, 0.95);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .form-dual-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .modal-submit-btn {
            width: 100%;
            background: var(--accent-gradient);
            color: white;
            border: none;
